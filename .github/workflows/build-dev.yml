
name: Build Dev Release

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

# Serialize development builds and release updates.
concurrency:
  group: dev-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Determine latest stable version
        id: version
        shell: bash
        run: |
          git fetch --tags --force

          LATEST_TAG=$(
            git tag --list 'v[0-9]*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1
          )

          if [ -z "$LATEST_TAG" ]; then
            echo "No stable release tag found."
            exit 1
          fi

          VERSION="${LATEST_TAG#v}"

          echo "Latest stable release: $VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build desktop package (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x ./gradlew
          # Verify + test what exists today; packaging is skipped until the
          # composeApp module lands (issue #4).
          ./gradlew build "-PappVersion=${{ steps.version.outputs.value }}"
          if [ -d composeApp ]; then
            ./gradlew :composeApp:packageDistributionForCurrentOS \
              "-PappVersion=${{ steps.version.outputs.value }}"
          else
            echo "composeApp module not present yet - skipping desktop packaging."
          fi

      - name: Build Android APK
        if: runner.os == 'Linux'
        run: |
          if [ -d composeApp ]; then
            ./gradlew :composeApp:assembleDebug \
              "-PappVersion=${{ steps.version.outputs.value }}"
          else
            echo "composeApp module not present yet - skipping Android APK."
          fi

      - name: Build desktop package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\gradlew.bat build "-PappVersion=${{ steps.version.outputs.value }}"
          if (Test-Path composeApp) {
            .\gradlew.bat :composeApp:packageDistributionForCurrentOS `
              "-PappVersion=${{ steps.version.outputs.value }}"
          } else {
            Write-Host "composeApp module not present yet - skipping desktop packaging."
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dev-build-${{ runner.os }}
          path: |
            composeApp/build/compose/binaries/**
            composeApp/build/outputs/apk/**
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Update dev pre-release
    needs: build
    runs-on: ubuntu-latest

    # Only real dev pushes update the rolling pre-release: pull_request
    # events run with restricted GITHUB_TOKEN permissions and cannot
    # create/update releases (and release assets don't exist pre-merge).
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dev-build-*
          path: release-assets
          merge-multiple: true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
          persist-credentials: true

      - name: Update dev pre-release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        shell: bash
        run: |
          # Find the latest stable release.
          git fetch --tags --force

          LATEST_TAG=$(
            git tag --list 'v[0-9]*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1
          )

          if [ -z "$LATEST_TAG" ]; then
            echo "No stable release tag found."
            exit 1
          fi

          # Remove the previous dev release and its tag.
          if gh release view dev >/dev/null 2>&1; then
            gh release delete dev --yes --cleanup-tag
          fi

          # Move the dev tag to the current commit.
          git tag -f dev "$GITHUB_SHA"
          git push origin refs/tags/dev --force

          # Create the replacement pre-release.
          gh release create dev \
            --target "$GITHUB_SHA" \
            --title "dev" \
            --notes "Development build based on ${LATEST_TAG}. Commit: ${GITHUB_SHA}" \
            --prerelease

          # Attach all generated packages.
          mapfile -d '' ASSETS < <(
            find release-assets -type f -print0
          )

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No build artifacts found - skipping pre-release update (composeApp module not present yet; see issue #4)."
            exit 0
          fi

          gh release upload dev "${ASSETS[@]}"

          echo "Development release updated successfully."
