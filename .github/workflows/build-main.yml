name: Build Main Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: main-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and verify
        run: |
          chmod +x ./gradlew
          ./gradlew build

      # Packaging stays conditional on the composeApp module (issue #4 pattern);
      # it resumes automatically once the module lands.
      - name: Build desktop package (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ -d composeApp ]; then
            ./gradlew :composeApp:packageDistributionForCurrentOS
          else
            echo "composeApp module not present yet - skipping desktop packaging."
          fi

      - name: Build desktop package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path composeApp) {
            .\gradlew.bat :composeApp:packageDistributionForCurrentOS
          } else {
            Write-Host "composeApp module not present yet - skipping desktop packaging."
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: main-build-${{ runner.os }}
          path: |
            composeApp/build/compose/binaries/**
            composeApp/build/outputs/apk/**
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Upload release assets
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: main-build-*
          path: release-assets
          merge-multiple: true

      - name: Wait for the tag release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail

          # semantic-release (Release on Main) creates the GitHub release for
          # the tag; wait for it instead of racing it.
          for attempt in {1..12}; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              exit 0
            fi
            echo "Waiting for the release to be created (attempt $attempt)..."
            sleep 10
          done

          echo "No release found for $GITHUB_REF_NAME - skipping asset upload."
          exit 0

      - name: Attach build assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail

          mapfile -d '' ASSETS < <(
            find release-assets -type f -print0
          )

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No build artifacts - nothing to upload (composeApp module not present yet)."
            exit 0
          fi

          gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          echo "Release assets uploaded."
